kind = "web"
previewPath = "/"
title = "Joyest Enterprise"
description = "Joyest Enterprise's imported storefront for discovering food ingredients, browsing products, and ordering for homes and businesses."
version = "1.0.0"
id = "artifacts/joyest"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20631

[services.development]
run = "pnpm --filter @workspace/joyest run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/joyest", "run", "build" ]
serve = "static"
publicDir = "artifacts/joyest/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20631"
BASE_PATH = "/"
